@for (editor of [instance()]; track editor.generation) {
  <code-editor
    class="sql-editor-view"
    [root]="editorRoot"
    [value]="editor.value"
    [language]="'SQL'"
    [languages]="languages()"
    [extensions]="editor.extensions"
    [readonly]="readonly()"
    [disabled]="disabled()"
    [lineWrapping]="true"
  />
}
