@if (metadataOnly()) {
  <ion-card><sneat-datatug-project-menu-top /></ion-card>
} @else {
  <ion-card>
    <ion-item-divider color="light">
      <ion-segment [(ngModel)]="tab">
        <ion-segment-button value="project">Project</ion-segment-button>
        <ion-segment-button
          value="queries"
          title="Active Queries"
          aria-label="Active Queries"
        >
          <ion-icon name="terminal-outline" color="medium" />
        </ion-segment-button>
      </ion-segment>
    </ion-item-divider>
    @if (tab === 'project') {
      <sneat-datatug-project-menu-top />
    }
    @if (tab === 'queries') {
      <sneat-datatug-queries-menu />
    }
  </ion-card>
}
