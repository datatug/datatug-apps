<ion-title [class.compact]="compact()" [title]="projectTitle() ? pageTitle() + ' @ ' + projectTitle() : pageTitle()">
  @if (projectTitle(); as title) {
    <strong [attr.role]="heading() ? 'heading' : null" [attr.aria-level]="heading() ? 1 : null">{{ pageTitle() }}</strong> &#64; {{ title }}
  } @else {
    <strong [attr.role]="heading() ? 'heading' : null" [attr.aria-level]="heading() ? 1 : null">{{ pageTitle() }}</strong>
  }
  @if (subtitle(); as text) {
    <span class="dt-page-subtitle" [title]="text" data-testid="page-subtitle">{{ text }}</span>
  }
  <sneat-datatug-business-clock />
</ion-title>
