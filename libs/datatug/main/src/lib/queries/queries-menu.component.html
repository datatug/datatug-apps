<ion-item-divider color="light">
  <ion-label>Active queries</ion-label>
</ion-item-divider>
@for (query of queries(); track query.id) {
  <sneat-datatug-query-list-item
    [queryTitle]="query.title || query.id || ''"
    [type]="query.queryType"
    [createdAt]="query.def?.createdAt"
    [detail]="false"
    [selected]="query.id === currentQueryId()"
    (opened)="selectQuery(query.id)"
  >
    <ion-buttons slot="end" queryRowActions>
      <ion-button
        color="medium"
        title="Close query"
        aria-label="Close query"
        (click)="closeQuery($event, query)"
      >
        <ion-icon name="close-outline" />
      </ion-button>
    </ion-buttons>
  </sneat-datatug-query-list-item>
}
@if (!queries()?.length) {
  <ion-item>
    <ion-label color="medium">No queries open in this session</ion-label>
  </ion-item>
}
<ion-item button (click)="newQuery()" [disabled]="!hasProject()">
  <ion-icon slot="start" name="add" />
  <ion-label>New query</ion-label>
</ion-item>
<ion-menu-toggle autoHide="false">
  <ion-item button [routerLink]="queriesLink()" [disabled]="!hasProject()">
    <ion-icon slot="start" name="folder-open-outline" />
    <ion-label>Browse saved queries</ion-label>
  </ion-item>
</ion-menu-toggle>
