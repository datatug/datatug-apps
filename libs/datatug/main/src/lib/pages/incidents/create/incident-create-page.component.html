<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
    </ion-buttons>
    <ion-title>Houston, we've got a problem</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">
  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-input
          label="Title"
          label-placement="stacked"
          placeholder="What's happening?"
          [(ngModel)]="title"
          [disabled]="isSubmitting()"
          required="required"
          data-testid="incident-title-input"
        />
      </ion-item>
      <ion-item>
        <ion-textarea
          label="Description"
          label-placement="stacked"
          placeholder="A few words about what you're seeing (kept as the incident's description)"
          [(ngModel)]="description"
          [disabled]="isSubmitting()"
          [autoGrow]="true"
          data-testid="incident-description-input"
        />
      </ion-item>

      @if (errorMessage(); as error) {
        <ion-note color="danger" data-testid="incident-create-error">{{
          error
        }}</ion-note>
      }

      @if (contextFactCount()) {
        <ion-note color="medium" data-testid="incident-context-fact-count">
          {{ contextFactCount() }} enabled Investigation Context
          {{ contextFactCount() === 1 ? 'fact' : 'facts' }} will be attached.
        </ion-note>
      }

      <ion-button
        expand="block"
        color="danger"
        [disabled]="isSubmitting() || !title.trim() || !hasMutationScope()"
        (click)="submit()"
      >
        @if (isSubmitting()) {
          <ion-spinner slot="start" name="dots" />
        } @else {
          <ion-icon slot="start" name="rocket-outline" />
        }
        Houston, we've got a problem
      </ion-button>
      <ion-button
        expand="block"
        fill="clear"
        routerLink="/incidents"
        [queryParams]="scopeQueryParams()"
        [disabled]="isSubmitting()"
      >
        Cancel
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
