<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>DataTug.app</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">DataTug.app (condense)</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-content>
      <h2>Your data workbench</h2>
      <ul>
        <li>Feel the power of context</li>
        <li>Do not repeat yourself</li>
        <li>Collaborative work</li>
      </ul>
    </ion-card-content>
  </ion-card>

  <ion-grid class="home-cards-grid">
    <ion-row>
      <ion-col size="12" size-md="6" class="home-cards-col">
        <sneat-datatug-my-projects title="My projects" />
      </ion-col>
      <ion-col size="12" size-md="6" class="home-cards-col">
        <sneat-datatug-my-stores />
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card>
    <ion-card-content>
      <sneat-copyright />
    </ion-card-content>
  </ion-card>
</ion-content>
