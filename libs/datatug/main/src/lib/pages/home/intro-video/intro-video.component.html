@if (validId()) {
  <ion-card data-testid="intro-video">
    <ion-item color="light" lines="full" id="intro-video-title">
      <ion-label>
        <h2>Watch the one-minute intro</h2>
      </ion-label>
    </ion-item>
    <ion-card-content>
      <section class="frame" aria-labelledby="intro-video-title">
        @if (playing()) {
          <iframe
            [src]="playerUrl()"
            [title]="video().title"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
            data-testid="intro-video-player"
          ></iframe>
        } @else {
          <button
            type="button"
            class="poster"
            (click)="play()"
            [attr.aria-label]="'Play video: ' + video().title"
            data-testid="intro-video-play"
          >
            <img [src]="video().posterSrc" alt="" width="1280" height="720" loading="lazy" />
            <ion-icon name="play-circle" aria-hidden="true"></ion-icon>
          </button>
        }
      </section>
      <p class="note">Plays from YouTube. Nothing loads from YouTube until you press play.</p>
    </ion-card-content>
  </ion-card>
}
