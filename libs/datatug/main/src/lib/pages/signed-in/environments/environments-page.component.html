<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
      <ion-back-button />
    </ion-buttons>
    <sneat-datatug-page-title pageTitle="Environments" />
  </ion-toolbar>
</ion-header>

  />
</ion-content>
