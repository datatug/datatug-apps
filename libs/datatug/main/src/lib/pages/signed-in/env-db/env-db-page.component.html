<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button />
      <ion-back-button defaultHref="../.." />
    </ion-buttons>
    <sneat-datatug-page-title
      [pageTitle]="
        envDb
          ? envDb.id + ' (' + (env?.id || '') + ')'
          : loading()
            ? 'Database: loading...'
            : 'Database: ' + (dbId || 'unavailable')
      "
    />
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (loadError(); as error) {
    <ion-card>
      <ion-card-content>
        <p role="alert">{{ error }}</p>
        <ion-button (click)="retry()" [disabled]="loading()">Retry</ion-button>
      </ion-card-content>
    </ion-card>
  }
  <!-- Inline display wins over Ionic card display:block; keep the grid mounted. -->
  <ion-card [hidden]="!envDb" [style.display]="envDb ? null : 'none'">
    <ion-item>
      <ion-input
        label="Filter"
        [(ngModel)]="filter"
        (ionChange)="filterRows()"
        placeholder="Filter"
      />
    </ion-item>

    <ion-segment [(ngModel)]="tab" (ionChange)="tabChanged()">
      <ion-segment-button value="tables">
        <ion-label>
          Tables
          @if (envDb) {
            <ion-badge color="medium">{{ envDb.tables.length }}</ion-badge>
          }
        </ion-label>
      </ion-segment-button>
      <ion-segment-button value="views">
        <ion-label>
          Views
          @if (envDb) {
            <ion-badge color="medium">{{ envDb.views.length }}</ion-badge>
          }
        </ion-label>
      </ion-segment-button>
    </ion-segment>

    <ion-card-content>
      <div #grid></div>
    </ion-card-content>
  </ion-card>
</ion-content>
