<ion-item class="menu-selector-item">
  <ion-buttons slot="start" class="menu-selector-icon">
    <ion-button
      class="menu-selector-icon-button"
      fill="clear"
      routerLink="/"
      aria-label="Go to home"
    >
      <ion-icon name="storefront-outline" />
    </ion-button>
  </ion-buttons>
  @if (currentStoreId() && !stores()?.length) {
    <ion-label color="medium">Store</ion-label>
    <ion-select class="menu-selector-field" disabled [value]="currentStoreId()">
      <ion-select-option [value]="currentStoreId()">{{
        currentStoreDisplayLabel
      }}</ion-select-option>
    </ion-select>
  }
  @if (stores()?.length) {
    <ion-select
      class="menu-selector-field"
      aria-label="Store"
      label="Store"
      labelPlacement="floating"
      interface="popover"
      [value]="currentStoreId()"
      (ionChange)="switchStore($event)"
    >
      @for (store of stores(); track trackById($index, store)) {
        <ion-select-option [value]="store.id">
          {{ store.title || store.id }}
        </ion-select-option>
      }
    </ion-select>
  }
</ion-item>
