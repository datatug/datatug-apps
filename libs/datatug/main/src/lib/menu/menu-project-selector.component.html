<ion-item class="ion-no-padding">
  <ion-icon name="albums-outline" slot="start" aria-hidden="true" />
  @if (projects()?.length) {
    <ion-select
      class="project-selector"
      label="Project"
      labelPlacement="floating"
      aria-label="Project"
      interface="popover"
      [value]="currentProjectId()"
      (ionChange)="switchProject($event)"
    >
      @for (project of projects(); track project.id) {
        <ion-select-option [value]="project.id">
          {{ project.title || project.id }}
        </ion-select-option>
      }
    </ion-select>
  }
  @if (!projects()?.length && currentProjectId()) {
    <ion-label class="ion-text-wrap project-readonly">
      <p>Project</p>
      <h2>{{ projectLabel() }}</h2>
    </ion-label>
  }
  @if (currentStoreId() === 'firestore' && !projects()?.length) {
    <ion-buttons slot="end">
      <ion-button
        color="primary"
        aria-label="New project"
        title="New project"
        (click)="newProject()"
        [disabled]="!projects()"
      >
        <ion-icon slot="icon-only" name="add" />
      </ion-button>
    </ion-buttons>
  }
</ion-item>
