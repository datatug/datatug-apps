@if (!isLoginPage()) {
  <ion-card>
    <sneat-datatug-auth-menu-item />
  </ion-card>
}

@if (profile.showIncidentsMenuItem) {
  <ion-card>
    <ion-item
      routerLink="/incidents"
      button
      detail="false"
      data-testid="incidents-menu-item"
    >
      <ion-icon slot="start" name="warning-outline" color="danger" />
      <ion-label>Incidents</ion-label>
    </ion-item>
  </ion-card>
}

<ion-card>
  <sneat-datatug-menu-store-selector
    [datatugUser]="datatugUserState()?.record"
  />
  @if (currentStoreId()) {
    <sneat-datatug-menu-project-selector
      [datatugUser]="datatugUserState()?.record"
      (projectChanged)="onProjectChanged($event)"
    />
  }
  @if (currentProject()) {
    <sneat-datatug-menu-env-selector />
  }
</ion-card>

<!--<sneat-datatug-context-card *ngIf="currentProjectId" [projectId]="currentProjectId"/>-->

<!--<sneat-datatug-table-meta-card *ngIf="table" [meta]="table?.meta"/>-->
@if (currentProject()) {
  <sneat-datatug-project-menu />
}

<ion-card>
  <sneat-app-version />
</ion-card>
