<!--
  Home page keeps the panel mostly empty on purpose (UX brief §2): the Store
  selector, Incidents card and build-info card are project/footer chrome —
  duplicating them here was the "redundant controls" the brief called out.
  Incidents now lives in the project menu (project-menu-top).
-->
@if (!isHomePage()) {
  <ion-card>
    <sneat-datatug-menu-store-selector
      [datatugUser]="datatugUserState()?.record"
    />
    @if (currentStoreId()) {
      <sneat-datatug-menu-project-selector
        [datatugUser]="datatugUserState()?.record"
        (projectChanged)="onProjectChanged($event)"
      />
    }
    @if (currentProject() && currentProject()?.ref?.spaceID === undefined) {
      <sneat-datatug-menu-env-selector
        [project]="currentProject()"
        [currentEnvId]="currentEnvId()"
      />
    }
  </ion-card>
}

<!--<sneat-datatug-context-card *ngIf="currentProjectId" [projectId]="currentProjectId"/>-->

<!--<sneat-datatug-table-meta-card *ngIf="table" [meta]="table?.meta"/>-->
@if (currentProject()) {
  <sneat-datatug-project-menu
    [metadataOnly]="currentProject()?.ref?.spaceID !== undefined"
  />
}

@if (showAuthCard()) {
  <ion-card>
    <sneat-datatug-auth-menu-item />
  </ion-card>
}

@if (!isHomePage()) {
  <ion-card>
    <sneat-app-version />
  </ion-card>
  @if (profile.showPoweredByDalgo) {
    <p class="powered-by">
      <a
        href="https://dalgo.io"
        target="_blank"
        rel="noopener"
        aria-label="Powered by DALgo, the database abstraction layer for Go"
        data-testid="powered-by-dalgo"
        >Powered by DALgo ↗</a
      >
    </p>
  }
}
