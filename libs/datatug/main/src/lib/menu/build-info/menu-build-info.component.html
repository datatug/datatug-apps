<ion-item
  button="true"
  detail="false"
  lines="none"
  data-testid="build-info-toggle"
  [attr.aria-expanded]="expanded()"
  (click)="toggle()"
>
  <ion-label>
    2020 - {{ copyrightEndYear() }} &copy;
    <a
      href="https://datatug.app"
      target="_blank"
      rel="noopener"
      (click)="onLinkClick($event)"
      >DataTug.app</a
    >
  </ion-label>
  <ion-icon
    slot="end"
    data-testid="build-info-chevron"
    [name]="expanded() ? 'chevron-up-outline' : 'chevron-down-outline'"
  ></ion-icon>
</ion-item>
@if (expanded()) {
  <ion-item lines="none">
    <ion-label>
      <ion-note data-testid="build-info-version"
        >Version v{{ buildInfo.version }}</ion-note
      >
    </ion-label>
  </ion-item>
  <ion-item lines="none">
    <ion-label>
      <ion-note data-testid="build-info-hash" [title]="buildInfo.gitHash"
        >Build {{ shortGitHash }} &commat;
        {{ buildInfo.buildTimestamp }}</ion-note
      >
    </ion-label>
  </ion-item>
}
