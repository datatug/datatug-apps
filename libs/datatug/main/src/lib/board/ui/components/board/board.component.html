@if (!!boardDef()?.rows?.length) {
  @for (boardRowDef of boardDef()?.rows || []; track $index) {
    <sneat-datatug-board-row
      [boardRowDef]="boardRowDef"
      [boardContext]="boardContext()"
      [projectRef]="projectRef()"
      [boardId]="boardDef()?.id"
      [readBoardForRun]="readBoardForRun()"
    />
  }
} @else {
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-text color="medium">
          <p>No cards/widgets have been added to this board yet.</p>
        </ion-text>
      </ion-col>
    </ion-row>
  </ion-grid>
}
