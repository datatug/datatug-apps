<ion-row class="ion-no-padding">
  @for (boarCardDef of boardRowDef()?.cards; track boarCardDef.id) {
    <ion-col
      size="12"
      [sizeMd]="cardCols(boarCardDef.cols)"
      class="ion-no-padding"
    >
      <sneat-datatug-board-card
        [boarCardDef]="boarCardDef"
        [boardContext]="boardContext()"
        [projectRef]="projectRef()"
      />
    </ion-col>
  }
</ion-row>
