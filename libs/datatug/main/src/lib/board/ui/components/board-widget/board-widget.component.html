@let definition = widgetDef();
@switch (definition?.name) {
  @case ('tabs') {
    <sneat-datatug-tabs-widget
      [level]="level()"
      [tabsWidgetSettings]="tabsWidgetSettings"
      [boardContext]="boardContext()"
    />
  }
  <!--	@case ('SQL') {-->
  <!--			<sneat-datatug-sql-query-widget-->
  <!--					*ngSwitchCase="'SQL'"-->
  <!--					[level]="level"-->
  <!--					[tab]="cardTab //noinspection InvalidExpressionResultType"-->
  <!--					[data]="sqlWidgetSettings"-->
  <!--					[boardContext]="boardContext"-->
  <!--				/>-->
  <!--	}-->
  @default {
    <div class="ion-margin-top">
      @if (!definition) {
        No widget definition
      } @else if (!definition.name) {
        No widget name
      } @else {
        To be implemented: {{ definition.name }}
      }
    </div>
  }
}
