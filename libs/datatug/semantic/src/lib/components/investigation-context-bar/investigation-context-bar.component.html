@if (items().length) {
  <div class="investigation-context-bar">
    @for (item of items(); track item.id + ':' + (item.layer || 'canonical')) {
      <ion-chip
        [outline]="!item.enabled"
        class="investigation-context-bar__chip"
        [class.investigation-context-bar__chip--disabled]="!item.enabled"
        [attr.title]="item.source"
        (click)="toggle(item.id, item.enabled, item.layer)"
      >
        <ion-icon
          [name]="item.enabled ? 'checkmark-circle-outline' : 'ban-outline'"
        ></ion-icon>
        <ion-label>{{ item.label }}</ion-label>
        <ion-icon
          name="close"
          (click)="remove(item.id, item.layer, $event)"
        ></ion-icon>
      </ion-chip>
    }
  </div>
}
