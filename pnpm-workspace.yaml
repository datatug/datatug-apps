overrides:
  # compiler-cli 22.2.3 imports encodeRangeMappings, missing in sourcemap-codec 1.5.5 (from main #506).
  '@angular/compiler-cli>@jridgewell/sourcemap-codec': 1.6.0
  '@angular-devkit/core': 22.2.3
  '@angular-devkit/schematics': 22.2.3
  '@angular/router': 22.2.3
