<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>DataTug.app</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <!-- Theme before first paint (no flash). Same key and rules as ThemeService in
         libs/datatug/main/src/lib/services/theme/theme.service.ts: light | dark | auto (default, follows the OS). -->
    <script id="datatug-theme-init">
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        function apply() {
          // ThemeService records the live choice here, so a blocked localStorage does not turn Dark back into Auto.
          var mode = root.getAttribute('data-theme-mode') || 'auto';
          if (!root.getAttribute('data-theme-mode')) try { var stored = localStorage.getItem('datatug.theme.v1'); if (stored === 'light' || stored === 'dark') mode = stored; } catch (e) {}
          var dark = mode === 'dark' || (mode === 'auto' && !!query && query.matches);
          root.classList.toggle('ion-palette-dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        }
        apply();
        // `auto` follows the OS on every page, before and without ThemeService (the app's lazy-loaded library).
        if (query && query.addEventListener) query.addEventListener('change', apply);
      })();
    </script>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Hand-off from the sites (/demo?q=…, the project page /project/github.com/<owner>/<repo>/start-chat#msg=…, and
         the old /project/github.com/<owner>/<repo>/chat?msg=…): take the visitor's question out of the address bar
         before Google Analytics can read the URL. The same address rules and storage key as in
         src/app/demo-handoff-path.ts and demo-handoff-capture.ts, which parses what is kept here (their specs run
         this script to keep them in step): matrix parameters, a trailing slash, letter case, extra leading slashes
         (`//demo`) and a path written as one group at the root (`/(demo)`) do not change what a hand-off address is,
         exactly as the router's parser reads them (`s` is the path as the router has it); a path with an outlet group
         `(` is not one. A start-chat address (`…/start-chat`, `…/tree/<ref>[/<dir>…]/-/start-chat`) carries the question
         after `#` (founder ruling 2026-10-03): the whole fragment and the `msg`, `q` and `lang` keys of its query go
         (the other query keys stay), and those keys, fragment first, are kept. On `/demo` and the old chat address the
         whole query goes and is kept. Any other path is untouched, except that every other address under
         /project/github.com loses `msg` and `q` (the question is dropped, except q on the exact Quick Search page), the
         rest of its query and its fragment staying. -->
    <!-- Scrub GitHub callback credentials before analytics and app bootstrap. -->
    <script id="datatug-github-callback-scrub">
      (function () {
        // Match the router's primary segments, including matrix/group spellings.
        // Over-scrubbing a refused callback spelling is safer than exposing credentials.
        var path = location.pathname, group = /^\/\(([^()]*)\)/.exec(path);
        var segments = (group ? group[1] : path).replace(/^\/+/, '').split('/');
        function segment(value) {
          value = (value || '').split(';')[0].split('(')[0];
          try { return decodeURIComponent(value); } catch (e) { return value; }
        }
        if (segment(segments[0]) !== 'github' || segment(segments[1]) !== 'callback') return;
        var params = new URLSearchParams(location.search);
        var codes = params.getAll('code'),
          states = params.getAll('state'),
          errors = params.getAll('error');
        var handoff =
          codes.length === 1 && states.length === 1 && codes[0] && states[0]
            ? { code: codes[0], state: states[0] }
            : errors.length === 1 && states.length === 1 && errors[0] && states[0]
              ? { error: errors[0], state: states[0] }
            : undefined;
        // No secrets in URL, history state, browser storage or analytics.
        history.replaceState(null, '', (path.slice(0, 2) === '//' ? location.origin : '') + path);
        window.__datatugTakeGitHubAuthorization = function () {
          delete window.__datatugTakeGitHubAuthorization;
          var value = handoff;
          handoff = undefined;
          return value;
        };
      })();
    </script>

    <!-- Scrub the short-lived hosted Google log receipt before analytics or app bootstrap. -->
    <script id="datatug-google-logs-callback-scrub">
      (function () {
        var params = new URLSearchParams(location.search);
        var status = params.get('googleLogs');
        if (status !== 'complete' && status !== 'failed') return;
        var receipt = status === 'complete' ? params.get('receipt') || '' : '';
        params.delete('googleLogs');
        params.delete('receipt');
        var query = params.toString();
        history.replaceState(
          history.state,
          '',
          location.pathname + (query ? '?' + query : '') + location.hash,
        );
        window.__datatugTakeGoogleLogsReturn = function () {
          delete window.__datatugTakeGoogleLogsReturn;
          var result = { status: status, receipt: receipt };
          status = undefined;
          receipt = undefined;
          return result;
        };
      })();
    </script>

    <script id="datatug-handoff-stash">
      (function () {
        // `u`: a path that starts with `//` is, to history.replaceState, an address on another host; it needs its origin.
        var p = location.pathname, g = /^\/\(([^()]*)\)/.exec(p), i, kept, got, left, taken, n, asciiShort = true, u = p.slice(0, 2) === '//' ? location.origin : '',
            s = (g ? g[1] : p.replace(/\/$/, '')).replace(/^\/+/, '').split('/'),
            h = location.hash, q = location.search, page = 'start-chat';
        if (!q && !h) return;
        // The key of a `name=value` pair as URLSearchParams reads it.
        function keyOf(pair) {
          var key = pair.split('=')[0].replace(/\+/g, ' ');
          try { key = decodeURIComponent(key); } catch (e) {}
          return key;
        }
        function ours(pair) {
          var key = keyOf(pair);
          return key === 'msg' || key === 'q' || key === 'lang';
        }
        i = s.indexOf('');
        if (i >= 0 && i < s.length - 1) s.length = i;
        for (i = 0; i < s.length; i++) {
          s[i] = s[i].split(';')[0];
          try { s[i] = decodeURIComponent(s[i]); } catch (e) {}
          if (!/^[\x20-\x7e]+$/.test(s[i])) asciiShort = false;
          s[i] = s[i].toLowerCase();
        }
        n = s.length;
        if ((g ? g[1].indexOf('//') < 0 : p.indexOf('(') < 0) && s[0] === 'project' && s[1] === 'github.com' && s[2] && s[3] &&
            (n === 5 ? s[4] === page : n >= 8 && s[4] === 'tree' && s[5] && s[n - 2] === '-' && s[n - 1] === page && s.slice(6, n - 2).indexOf('-') < 0 ||
              asciiShort && n === 6 && s[2] === 'datatug' && s[3] === 'datatug-demo-project' && s[4] === 'demo-project-1' && s[5] === page)) {
          // The confirmation page: the question is after `#`, or (a form post with no script) in the query.
          got = []; left = []; taken = 0;
          h.slice(1).split('&').forEach(function (pair) { if (ours(pair)) got.push(pair); });
          if (q) q.slice(1).split('&').forEach(function (pair) {
            if (ours(pair)) { got.push(pair); taken++; } else left.push(pair);
          });
          if (got.length) {
            window.__datatugHandoffSearch = '?' + got.join('&');
            // So that a reload before the app has started does not lose the question.
            try { sessionStorage.setItem('datatug.demo.handoff.v1', p.replace(/\/$/, '') + window.__datatugHandoffSearch); } catch (e) {}
          }
          if (h || taken) {
            try { history.replaceState(history.state, '', u + p + (left.length ? '?' + left.join('&') : '')); } catch (e) {}
          }
        } else if (!q) {
          return;
        } else if ((g ? g[1].indexOf('//') < 0 : p.indexOf('(') < 0) && (s[0] === 'demo' ? n === 1 : s[0] === 'project' && s[1] === 'github.com' && s[2] && s[3] &&
            (n === 5 ? s[4] === 'chat' : n >= 8 && s[4] === 'tree' && s[5] && s[n - 2] === '-' && s[n - 1] === 'chat' && s.slice(6, n - 2).indexOf('-') < 0))) {
          window.__datatugHandoffSearch = q;
          // So that a reload before the app has started does not lose the question.
          try { sessionStorage.setItem('datatug.demo.handoff.v1', p.replace(/\/$/, '') + q); } catch (e) {}
          // A browser that refuses must not stop the page: the app still reads the question from the stash.
          try { history.replaceState(history.state, '', u + p + h); } catch (e) {}
        } else if (s[0] === 'project' && s[1] && s[1].split('(')[0] === 'github.com') {
          kept = q.slice(1).split('&').filter(function (pair) {
            var key = keyOf(pair);
            // Only a closed Quick Search page owns q; chat questions are still removed.
            var quickSearch = !g && p.indexOf('(') < 0 && asciiShort &&
              /^[a-z0-9][a-z0-9-]{0,38}$/.test(s[2] || '') && /^(?!\.{1,2}$)[a-z0-9._-]{1,100}$/.test((s[3] || '').replace(/\.git$/, '')) && !/\.git\.git$/.test(s[3] || '') &&
              p.replace(/^\/+/, '').replace(/\/$/, '').split('/').every(function (part) { return !!part; }) &&
              s.slice(5, n - 2).every(function (part) { return part !== '.' && part !== '..' && part === part.trim() && !/[\\/%?#@]/.test(part); }) &&
              (n === 5 && s[4] === 'quick-search' || n >= 8 && s[4] === 'tree' && s[5] && s[n - 2] === '-' && s[n - 1] === 'quick-search' && s.slice(6, n - 2).indexOf('-') < 0);
            return key !== 'msg' && (key !== 'q' || quickSearch);
          });
          if (kept.length !== q.slice(1).split('&').length) {
            try { history.replaceState(history.state, '', u + p + (kept.length ? '?' + kept.join('&') : '') + h); } catch (e) {}
          }
        }
      })();
    </script>

    <!-- DataTug launch: optional tracking disabled before any SDK starts. PostHog and Firebase Analytics stay off.
         DataTug's own Google Analytics property (G-DESWRP39RY) is not switched off here: it loads only after the
         visitor accepts the analytics banner (src/app/analytics-consent), and never on a checkout page, where the
         script below disables it. -->
    <script>
      (function () {
        // Match product-profile resolution before Angular is available. Only the
        // established local development hosts honor the profile query override.
        var host = location.hostname;
        var local = host === 'localhost' || host === '127.0.0.1' || host === '' || host.endsWith('.local') || host.includes('.ngrok.');
        var profile = local ? new URLSearchParams(location.search).get('profile') : null;
        var incidentius = profile === 'incidentius' || (profile !== 'datatug' && host === 'app.incidentius.com');
        if (!incidentius) {
          window.__datatugOptionalTrackingDisabled = true;
          ['G-SNF2R7PDY7', 'G-TYBDTV738R', 'G-PROVIDE_IF_NEEDED'].forEach(function (id) { window['ga-disable-' + id] = true; });
        }
      })();
    </script>

    <!-- Checkout privacy: before any Google Analytics script or page view. -->
    <script>
      (function () {
        try {
          function normalize(address) { return address.split(/[?#]/)[0].split('/').filter(Boolean).map(function (part) {
            return decodeURIComponent(part).split(';')[0].toLowerCase();
          }).join('/'); }
          var path = normalize(location.pathname);
          var authPage = ['login', 'sso', 'sign-in-from-email-link'].indexOf(path) >= 0;
          var returnTo = new URLSearchParams(location.search || '').get('returnTo');
          var continuation = authPage && (location.hash || '').slice(0, 2) === '#/' ? normalize(location.hash.slice(1)) :
            authPage && returnTo && returnTo.slice(0, 1) === '/' && returnTo.slice(0, 2) !== '//' ? normalize(returnTo) : '';
          if ([path, continuation].some(function (value) { return value === 'checkout/sign-in' || value === 'subscriptions' || value.indexOf('subscriptions/') === 0 || value === 'subscribe' || value === 'pricing/return' || value === 'business/checkout' || value === 'business/checkout/return'; })) {
            window.__datatugCheckoutPrivacy = true;
            ['G-DESWRP39RY', 'G-SNF2R7PDY7', 'G-TYBDTV738R', 'G-PROVIDE_IF_NEEDED'].forEach(function (id) { window['ga-disable-' + id] = true; });
          }
        } catch (_) { /* Invalid routes are not checkout. */ }
      })();
    </script>
    <!-- Google Analytics (skipped on localhost and checkout) -->
    <script>
      if (!window.__datatugCheckoutPrivacy && !window.__datatugOptionalTrackingDisabled && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SNF2R7PDY7';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SNF2R7PDY7', {page_location: location.origin + location.pathname});
      }
    </script>
  </head>

  <body>
    <sneat-datatug-root></sneat-datatug-root>
  </body>
</html>
