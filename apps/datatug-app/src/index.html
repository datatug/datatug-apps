<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataTug.app</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Hand-off from the sites (/demo?q=… and /project/github.com/<owner>/<repo>/chat?msg=…): take the visitor's
         question out of the address bar before Google Analytics can read the URL. The same address rules and
         storage key as in src/app/demo-handoff-path.ts and demo-handoff-capture.ts, which parses what is kept here
         (their specs run this script to keep them in step): matrix parameters, a trailing slash and letter case do
         not change what a hand-off address is, exactly as the router matches them; a path with an outlet group `(` is not
         one. Any other path is untouched. -->
    <script id="datatug-handoff-stash">
      (function () {
        var p = location.pathname, s = p.split('/').slice(1), i;
        if (!location.search || p.indexOf('(') >= 0) return;
        if (s[s.length - 1] === '') s.pop();
        for (i = 0; i < s.length; i++) {
          s[i] = s[i].split(';')[0];
          try { s[i] = decodeURIComponent(s[i]); } catch (e) {}
          s[i] = s[i].toLowerCase();
        }
        if (s[0] === 'demo' ? s.length === 1 : s[0] === 'project' && s[1] === 'github.com' && s[2] && s[3] &&
            (s.length === 5 ? s[4] === 'chat' : s.length === 8 && s[4] === 'tree' && s[5] && s[6] === '-' && s[7] === 'chat')) {
          window.__datatugHandoffSearch = location.search;
          // So that a reload before the app has started does not lose the question.
          try { sessionStorage.setItem('datatug.demo.handoff.v1', p.replace(/\/$/, '') + location.search); } catch (e) {}
          // A browser that refuses must not stop the page: the app still reads the question from the stash.
          try { history.replaceState(history.state, '', p + location.hash); } catch (e) {}
        }
      })();
    </script>

    <!-- Google Analytics (skipped on localhost) -->
    <script>
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SNF2R7PDY7';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SNF2R7PDY7');
      }
    </script>
  </head>

  <body class="dark">
    <sneat-datatug-root></sneat-datatug-root>
  </body>
</html>
