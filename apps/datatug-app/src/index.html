<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DataTug.app</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/png" href="assets/icon/favicon.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Hand-off from the sites (/demo?q=… and /project/github.com/<owner>/<repo>/chat?msg=…): take the visitor's
         question out of the address bar before Google Analytics can read the URL. The same path test and storage
         key as in src/app/demo-handoff-capture.ts, which parses what is kept here (its spec runs this script to
         keep them in step). Any other path is untouched. -->
    <script id="datatug-handoff-stash">
      (function () {
        var p = location.pathname;
        if (location.search && /^\/(?:demo|project\/github\.com\/[^/]+\/[^/]+(?:\/tree\/[^/]+\/-)?\/chat)\/?$/.test(p)) {
          window.__datatugHandoffSearch = location.search;
          // So that a reload before the app has started does not lose the question.
          try { sessionStorage.setItem('datatug.demo.handoff.v1', p.replace(/\/$/, '') + location.search); } catch (e) {}
          history.replaceState(history.state, '', p + location.hash);
        }
      })();
    </script>

    <!-- Google Analytics (skipped on localhost) -->
    <script>
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-SNF2R7PDY7';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-SNF2R7PDY7');
      }
    </script>
  </head>

  <body class="dark">
    <sneat-datatug-root></sneat-datatug-root>
  </body>
</html>
