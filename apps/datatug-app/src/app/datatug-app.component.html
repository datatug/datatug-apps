<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="light">
          <ion-title>
            <a
              class="brand-home-link"
              routerLink="/"
              [attr.aria-label]="profile.brandName + ' home'"
              (click)="closeMenu()"
              >{{ profile.brandName }}@if (profile.planned) {<span class="brand-planned-badge"> Planned</span>}</a
            >
          </ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content color="light">
        <router-outlet name="menu" />
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content" />
  </ion-split-pane>
</ion-app>
