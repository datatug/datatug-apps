<ion-app [class.compact-header-mode]="compactHeader()">
  @if (checkoutAuth()) {
    <header class="auth-brand">
      <a routerLink="/home" [attr.aria-label]="profile.brandName + ' home'">{{
        profile.brandName
      }}</a>
    </header>
  }
  <!--
    Compact application header for narrow layouts (UX brief §1): when the
    side panel is hidden there was no header/menu affordance at all. Sits
    outside the split pane (ion-split-pane identifies its main child by id
    among DIRECT children, so the header cannot live inside it) and shares
    the side-panel's grayish `color="light"` chrome family.
  -->
  @if (compactHeader()) {
    <ion-header class="compact-header">
      <ion-toolbar color="light">
        @if (!homePanelHidden()) {
          <ion-buttons slot="start">
            <ion-menu-button
              menuIcon="menu-outline"
              class="app-level-menu-button"
            ></ion-menu-button>
          </ion-buttons>
        }
        <ion-title size="small">
          <a
            class="brand-home-link compact-brand"
            routerLink="/"
            [attr.aria-label]="profile.brandName + ' home'"
            >{{ profile.brandName }}</a
          >
          @if (profile.motto) {
            <span class="compact-motto">{{ profile.motto }}</span>
          }
        </ion-title>
        @if (authStatus() === 'notAuthenticated') {
          <ion-buttons slot="end">
            <ion-button color="primary" routerLink="/login">
              Sign in
            </ion-button>
          </ion-buttons>
        }
      </ion-toolbar>
    </ion-header>
  }
  <ion-split-pane
    [class.authentication]="checkoutAuth()"
    contentId="main-content"
    [when]="paneWhen()"
  >
    <ion-menu
      [disabled]="checkout() || homePanelHidden()"
      [style.display]="checkout() || homePanelHidden() ? 'none' : null"
      contentId="main-content"
      type="overlay"
      sneatResizableMenu
      sneatResizableMenuStorageKey="datatug.menu.width"
    >
      <ion-header>
        <ion-toolbar color="light">
          <ion-title>
            <a
              class="brand-home-link"
              routerLink="/"
              [attr.aria-label]="profile.brandName + ' home'"
              (click)="closeMenu()"
              >{{ profile.brandName }}
              @if (profile.planned) {
                <span class="brand-planned-badge"> Planned</span>
              }
            </a>
          </ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content color="light">
        <router-outlet name="menu" />
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content" />
  </ion-split-pane>
</ion-app>
