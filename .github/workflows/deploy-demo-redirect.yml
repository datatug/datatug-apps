name: Deploy demo.datatug.app redirect (Cloudflare)

# demo.datatug.app -> https://datatug.app/demo (founder 2026-10-23), a Worker of its own:
# workers/demo-redirect/ (index.mjs, wrangler.jsonc). Its custom domain makes the DNS record for
# demo.datatug.app itself on the first deploy. The redirect's tests run before wrangler publishes.
# Auth is org-level, as for the app's own deploy.yml: CLOUDFLARE_API_TOKEN secret + CLOUDFLARE_ACCOUNT_ID variable.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - workers/demo-redirect/**
      - .github/workflows/deploy-demo-redirect.yml

permissions:
  contents: read

concurrency:
  group: deploy-demo-redirect
  cancel-in-progress: false

jobs:
  deploy:
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@ab513afde830771ff71391cfc3322b6977512594
    with:
      working-directory: .
      build-command: node --test workers/demo-redirect/index.test.mjs
      wrangler-config: workers/demo-redirect/wrangler.jsonc
      node-version: '24'
      pnpm-version: '11.26.0'
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      smoke-command: node workers/demo-redirect/post-deploy-smoke.mjs
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
