name: Deploy (Cloudflare)

# Deploys the datatug.app worker to Cloudflare (Workers static assets) via the
# shared reusable cf-deploy workflow (sneat-co/cicd), so datatug.app deploys
# the same way as every other Sneat site and each deploy is visible/auditable
# in GitHub Actions. The worker is defined by the repo-root wrangler.jsonc,
# which serves datatug.app and app.incidentius.com from
# dist/apps/datatug-app/browser.
#
# Auth is org-level: CLOUDFLARE_API_TOKEN secret + CLOUDFLARE_ACCOUNT_ID
# variable (an identifier, not a secret). No per-repo secrets are needed.
#
# DEPLOY GATE (fail-closed). cf-deploy runs no tests, so this workflow must
# never start from a push: it starts when CI finishes (`workflow_run`) and the
# `gate` job lets the deploy through only if ALL of these hold, else the deploy
# job is skipped (no deploy):
#   1. the CI run was a push to main of this repository;
#   2. the commit CI validated is the commit cf-deploy will check out
#      (GITHUB_SHA) AND is main's CURRENT tip, read live from the API when the
#      gate runs. An older commit (a late CI finish, or "Re-run jobs" on an old
#      deploy run, which keeps its old SHA) is never deployed over a newer one;
#      the newer commit deploys after its own CI. Not covered: a push landing
#      between this check and publish (the newer commit's own deploy then runs
#      after this one, via the concurrency group). Details: deploy-gate.sh.
#   3. that CI run's `deploy-gate` job concluded `success`. The lane list lives
#      in ci.yml next to the lanes. It covers every lane except the live-API
#      PostgreSQL demo lane (e2e-demo-postgresql: an outage of
#      cloud.openvaultdb.com must not block shipping, but it still fails the
#      `e2e` aggregate and its own check, so the outage stays visible). A
#      missing, skipped, cancelled or failed deploy-gate means no deploy.
# Logic and its tests: .github/scripts/deploy-gate.sh.
# Runs are serialised (one deploy at a time, none cancelled mid-publish).
#
# Manual `workflow_dispatch` (needs write access) is limited to main's tip and
# re-checks the same gate for that commit, so it is a redeploy button, not a
# bypass. For an emergency only: tick `override_ci_gate` and give a reason; the
# (sanitised, single-line, length-capped) reason and actor are logged in the run
# summary. The override skips only the CI check, never the main-tip check, and
# never works from another branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      override_ci_gate:
        description: Emergency only - deploy main's tip without a green CI deploy-gate
        type: boolean
        default: false
      override_reason:
        description: Required with override_ci_gate (logged in the run summary)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-datatug-app
  cancel-in-progress: false

jobs:
  gate:
    name: deploy gate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 0
      - name: Require a green CI deploy-gate for this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          OVERRIDE: ${{ inputs.override_ci_gate }}
          REASON: ${{ inputs.override_reason }}
        run: .github/scripts/deploy-gate.sh

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: sneat-co/cicd/.github/workflows/cf-deploy.yml@ab513afde830771ff71391cfc3322b6977512594
    with:
      # The Angular app and its wrangler config both live at the repo root,
      # and cf-deploy's Nx fallback builds it with `pnpm exec nx build
      # datatug-app` (which also runs the stamp-build-info dependency).
      working-directory: .
      build-target: datatug-app
      # The script runs the app's uncached Nx build (whose dependency performs
      # online tag/attestation verification), then verifies emitted assets
      # before Wrangler can publish them.
      #
      # AG_GRID_LICENSE_KEY is OPTIONAL: the repository VARIABLE of that name (empty/unset by default -> a
      # community-only build that never downloads AG Grid Enterprise). tools/stamp-ag-grid-license.mjs reads it
      # during the Nx build. cf-deploy has no env pass-through, hence the inline assignment. AG Grid keys are
      # public client-side config (shipped in the bundle) but this line is visible in the job log; see
      # docs/ag-grid-enterprise-license.md. Do not put a key containing a single quote here.
      build-command: AG_GRID_LICENSE_KEY='${{ vars.AG_GRID_LICENSE_KEY }}' python3 tools/recordsetcompare/build_app.py
      build-github-app-client-id: Iv23li26w131Kv6u3IdM
      build-github-app-owner: datatug
      build-github-app-repositories: datatug-core
      node-version: '24'
      pnpm-version: '11.26.0'
      cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    secrets:
      BUILD_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-receipt:
    needs: [gate, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record the commit after successful application deployment
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python3 -c 'import json, os;
          print(json.dumps({"schema_version": 1, "head_sha": os.environ["DEPLOYED_SHA"],
          "run_id": int(os.environ["DEPLOY_RUN_ID"]),
          "run_attempt": int(os.environ["DEPLOY_RUN_ATTEMPT"])}))' > deployed-sha.json
      - uses: actions/upload-artifact@v7
        with:
          name: deployed-sha
          path: deployed-sha.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
