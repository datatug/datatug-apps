name: GitHub live smoke

# The ONE e2e lane that talks to the real GitHub (api.github.com, raw.githubusercontent.com, cdn.jsdelivr.net). Every other
# lane answers GitHub from shallow checkouts of the commits in apps/datatug-app/e2e/github-pins.json and fails a test whose
# GitHub request reaches the network (apps/datatug-app/e2e/helpers/demodb-guard.ts, GITHUB_E2E_MODE=checkout).
#
# Runs after a push to main (what deploys), or by hand. Never on a pull request, never on a schedule. It proves two things:
#   1. every pin still exists on GitHub and GitHub still answers it the way the fake does (commit, recursive tree, a raw
#      file byte for byte); a pin that only lives in a pull request ref can disappear;
#   2. the reader still works against the real hosts at the demo project's live `main`: the G-A2 request-budget walk of
#      github-store.spec.ts (cold + warm visit, every side-menu page), with at most GITHUB_E2E_MAX_LIVE_REQUESTS (30) API
#      calls per test and GITHUB_E2E_MAX_RUN_LIVE_REQUESTS (50) per run, under the anonymous 60 an hour; a 403 with
#      x-ratelimit-remaining 0 stops the run. Chromium only, one worker, no retries.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check every GitHub pin against the real GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fetch-github-pins.mjs
          # No pipe into a reader that can stop early (grep -q/-m, head, cmp): under pipefail the writer's SIGPIPE fails
          # the step. Every output is captured in full first, then inspected.
          pins="$(jq -r '.pins[] | "\(.repo) \(.sha)"' apps/datatug-app/e2e/github-pins.json)"
          # An empty pin list would run the loop zero times and pass without checking anything.
          test -n "$pins" || { echo '::error::No pins read from apps/datatug-app/e2e/github-pins.json; refusing to pass without checking any.'; exit 1; }
          while read -r repo sha; do
            dir="tmp/github-checkouts/$repo/$sha"
            test "$(gh api "repos/$repo/commits/$sha" --jq .sha)" = "$sha"
            tree="$(gh api "repos/$repo/git/trees/$sha?recursive=1")"
            test "$(jq -r '.truncated' <<<"$tree")" = false
            listing="$(git -C "$dir" ls-tree -r "$sha")"
            test "$(jq '[.tree[] | select(.type == "blob")] | length' <<<"$tree")" = "$(awk '$2 == "blob"' <<<"$listing" | wc -l | tr -d ' ')"
            file="$(awk -F '\t' '$2 ~ /\.(json|md|ya?ml)$/ { print $2; exit }' <<<"$listing")"
            test -n "$file"
            curl -fsSL -o "$RUNNER_TEMP/pin-live" "https://raw.githubusercontent.com/$repo/$sha/$file"
            git -C "$dir" show "$sha:$file" > "$RUNNER_TEMP/pin-local"
            cmp "$RUNNER_TEMP/pin-live" "$RUNNER_TEMP/pin-local"
            echo "pin ok: $repo@$sha ($file)"
          done <<<"$pins"

      - name: Authenticate private Core artifact verification
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm

      # DemoDB stays on its fixtures here (the DemoDB live smoke is demodb-live-smoke.yml).
      - name: Restore DemoDB fixtures
        uses: actions/cache/restore@v5
        with:
          path: tmp/demodb-fixtures
          key: demodb-fixtures-v2-${{ hashFiles('libs/datatug/main/src/lib/queries/demo-sqlite-catalog.ts', 'scripts/fetch-demodb-fixtures.mjs') }}

      - name: Install Chromium
        uses: ./.github/actions/playwright-install
        with:
          browsers: chromium

      - name: Run the live GitHub walk (Chromium, one worker, no retries)
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          GITHUB_E2E_MODE: live
          GITHUB_E2E_MAX_LIVE_REQUESTS: '30'
          GITHUB_E2E_MAX_RUN_LIVE_REQUESTS: '50'
        run: >-
          pnpm exec playwright test -c apps/datatug-app/playwright.config.ts --project=chromium --workers=1 --retries=0
          --forbid-only --max-failures=1 github-store.spec.ts -g "request budget|every side-menu page loads"

      - name: Print request report
        if: always()
        run: |
          shopt -s nullglob
          for report in "$GITHUB_WORKSPACE"/coverage/demodb-request-report-*.md; do cat "$report"; done

      - name: Upload live smoke report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: github-live-smoke-playwright-report
          path: coverage/apps/datatug-app-e2e/report
          if-no-files-found: ignore
