name: CI

on:
  # No paths-ignore on push: every commit on main must get a CI run so the
  # deploy workflow (deploy.yml, which deploys only after this run's
  # `deploy-gate` is green for the same commit) always has a verdict for main's tip.
  push:
    branches:
      - main
  pull_request:
  merge_group:
  # Nightly run of everything, including the lanes that need live third-party hosts (e2e-demo-postgresql). Those lanes
  # run ONLY on this event; pull_request, merge_group and push run the offline lanes (see e2e/README.md "Lane matrix").
  schedule:
    - cron: '17 3 * * *'

permissions:
  actions: read

# Superseded PR runs are cancelled (a force-push or a new commit on the same pull request, a Renovate rebase), so they
# stop spending runner time and network. Every other event gets a group of its own (the run id), so nothing else is
# ever cancelled or replaced: deploy.yml reads the `deploy-gate` job of the CI run of EACH main commit, so a push to
# main must always run to completion (a shared group would also drop all but one pending run, even with
# cancel-in-progress false).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test metadata classifier and verified baselines
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_classify_metadata_change.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_workflow_baseline.py' -v
      - name: Classify exact cumulative change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            echo '::notice::Scheduled nightly validation always runs the full application suites.'
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$GROUP_BASE"; head="$GROUP_HEAD" ;;
            push) base="$(python3 .github/scripts/workflow-baseline.py ci)"; head="$GITHUB_SHA" ;;
            *) base=""; head="" ;;
          esac
          result="$(python3 .github/scripts/classify-metadata-change.py "$base" "$head")"
          if [ "$result" = metadata-only ]; then
            echo 'mode=metadata-only' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Full validation required: $result"
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          fi
      - name: Install SpecScore for metadata validation
        if: steps.classify.outputs.mode == 'metadata-only'
        env:
          SPECSCORE_VERSION: v0.38.3
        run: |
          curl -fsSL https://specscore.md/install/get-cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate SpecScore tree
        if: steps.classify.outputs.mode == 'metadata-only'
        run: specscore spec lint

  build:
    needs: preflight
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: nx lint affected
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm nx affected --target=lint --base=${{ env.NX_BASE }} --parallel=8

      # Whole-repo static check (not nx-affected-scoped — it's a single
      # cheap AST walk, not a per-project target): fails the build if any
      # *.component.ts writes a plain field from inside subscribe()/then()/
      # catch()/finally()/setTimeout()/setInterval() and isn't listed in
      # tools/zoneless-allowlist.txt. See tools/check-zoneless-fields.mjs
      # for the rule and AGENTS.md's "Change detection & state" section for
      # the fix recipe.
      - name: check:zoneless (no new plain-field writes from async callbacks)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm run check:zoneless

      # Fixture-based unit tests for check-zoneless-fields.mjs's own AST
      # logic (tools/__tests__/) — cheap enough to run unconditionally
      # alongside the check itself, same as the check isn't nx-affected-scoped.
      - name: test:check-zoneless-fields (detector's own unit tests)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm run test:check-zoneless-fields

      - name: test:stamp-ag-grid-license (optional AG Grid key stamping)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm run test:stamp-ag-grid-license

      - name: test:checkout-flow (quote, payment and return contract)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm run test:checkout-flow

      - name: test:wrangler-routes (preserve production app hostnames)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm run test:wrangler-routes

      - name: test:RecordsetCompare artifact verifier guards
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: python3 -m unittest discover -s tools/recordsetcompare -p 'test_*.py' -v

      - name: nx build affected
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          # Optional repository variable; empty by default = community-only build. docs/ag-grid-enterprise-license.md
          AG_GRID_LICENSE_KEY: ${{ vars.AG_GRID_LICENSE_KEY }}
        run: pnpm nx affected --target=build --base=${{ env.NX_BASE }} --parallel=8

      - name: Find affected datatug-app target
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: affected-app
        run: |
          projects="$(pnpm exec nx show projects --affected --json)"
          app_affected="$(PROJECTS_JSON="$projects" node -e 'process.stdout.write(JSON.parse(process.env.PROJECTS_JSON).includes("datatug-app") ? "true" : "false")')"
          echo "datatug_app=$app_affected" >> "$GITHUB_OUTPUT"

      - name: Verify emitted RecordsetCompare assets
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (steps.affected-app.outputs.datatug_app == 'true') }}
        run: python3 tools/recordsetcompare/consume.py verify-dist

  test:
    needs: preflight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: nx typecheck-spec main
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm nx run datatug-main:typecheck-spec

      - name: Cache Vite dependency pre-bundle
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/cache@v5
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: nx test affected
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm nx affected --target=test --parallel=4 --base=${{ env.NX_BASE }} --outputStyle=stream

      - name: Upload main Vitest diagnostics
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: datatug-main-vitest-diagnostics
          path: coverage/libs/datatug/main/vitest-results.json
          if-no-files-found: warn
          retention-days: 7

  # Run full browser suites nightly at 03:17 UTC. Independent runners keep their
  # app servers, Playwright artifacts and Nx state from contending.
  e2e-checkout:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: Install checkout browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Set up Java for checkout Firestore emulator
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: nx checkout journey e2e
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            pnpm nx run datatug-app:e2e-checkout --skip-nx-cache
          else
            pnpm nx affected --target=e2e-checkout --parallel=1 --base=${{ env.NX_BASE }}
          fi

      - name: Upload checkout journey traces
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: checkout-journey-e2e-results
          path: coverage/apps/datatug-checkout/results
          if-no-files-found: ignore

  e2e-app:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      # The browser suite counts the real reader's GitHub API/raw requests, but
      # anonymous API access from a shared CI runner can exhaust its quota.
      # Pin the browser catalog to the revision this app admits. Advance it
      # atomically with support for a newer catalog's fixture URLs and assets.
      # Check the live API/tree/raw contracts at this exact revision.
      - name: Checkout validated browser demo revision
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: f40286a57ea3a04b93875335234665ece2595ed0
          path: datatug-demo-project

      - name: Verify pinned GitHub API tree and raw source
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          set -euo pipefail
          sha="$(git -C datatug-demo-project rev-parse HEAD)"
          test "$sha" = 'f40286a57ea3a04b93875335234665ece2595ed0'
          test "$(gh api "repos/datatug/datatug-demo-project/commits/$sha" --jq .sha)" = "$sha"
          tree="$(gh api "repos/datatug/datatug-demo-project/git/trees/$sha?recursive=1" --jq '[.truncated, ([.tree[].path] | index("demo-project-1/entities/Album/Album.entity.json") != null), ([.tree[].path] | index("demo-project-1/queries/customers/customer-invoices.query.json") != null)] | @json')"
          test "$tree" = '[false,true,true]'
          curl -fsSL "https://raw.githubusercontent.com/datatug/datatug-demo-project/$sha/demo-project-1/entities/Album/Album.entity.json" -o "$RUNNER_TEMP/demo-album.json"
          cmp datatug-demo-project/demo-project-1/entities/Album/Album.entity.json "$RUNNER_TEMP/demo-album.json"

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: Install Playwright browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium

      # DemoDB fixtures (see apps/datatug-app/e2e/helpers/demodb-guard.ts): the browser tests are served the pinned DemoDB
      # files from a local directory instead of the live demodb.dev hosts (the 2026-10-16 incident: ~25,500 requests for
      # one file rate limited the whole zone). Cached by the catalog's SHA-256 pins; Playwright's globalSetup
      # (scripts/fetch-demodb-fixtures.mjs) downloads each missing file once from GitHub, with no retry, and never from demodb.dev.
      - name: Restore DemoDB fixtures
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: demodb-fixtures
        uses: actions/cache/restore@v5
        with:
          path: tmp/demodb-fixtures
          key: demodb-fixtures-v2-${{ hashFiles('libs/datatug/main/src/lib/queries/demo-sqlite-catalog.ts', 'scripts/fetch-demodb-fixtures.mjs') }}

      - name: nx app e2e
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            pnpm nx run datatug-app:e2e --skip-nx-cache -- --project=chromium
          else
            pnpm nx affected --target=e2e --parallel=1 --base=${{ env.NX_BASE }} -- --project=chromium
          fi

      - name: Save DemoDB fixtures
        if: ${{ always() && needs.preflight.outputs.mode == 'full' && steps.demodb-fixtures.outputs.cache-hit != 'true' && hashFiles('tmp/demodb-fixtures/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: tmp/demodb-fixtures
          key: ${{ steps.demodb-fixtures.outputs.cache-primary-key }}

      - name: Upload app Playwright report and traces
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datatug-app-e2e-results
          path: |
            coverage/apps/datatug-app-e2e/report
            coverage/apps/datatug-app-e2e/results
          if-no-files-found: ignore

  e2e-query-mobile:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Checkout validated browser demo revision
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: f40286a57ea3a04b93875335234665ece2595ed0
          path: datatug-demo-project

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: Install mobile WebKit browser
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps webkit

      # DemoDB fixtures (see apps/datatug-app/e2e/helpers/demodb-guard.ts): the browser tests are served the pinned DemoDB
      # files from a local directory instead of the live demodb.dev hosts (the 2026-10-16 incident: ~25,500 requests for
      # one file rate limited the whole zone). Cached by the catalog's SHA-256 pins; Playwright's globalSetup
      # (scripts/fetch-demodb-fixtures.mjs) downloads each missing file once from GitHub, with no retry, and never from demodb.dev.
      - name: Restore DemoDB fixtures
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: demodb-fixtures
        uses: actions/cache/restore@v5
        with:
          path: tmp/demodb-fixtures
          key: demodb-fixtures-v2-${{ hashFiles('libs/datatug/main/src/lib/queries/demo-sqlite-catalog.ts', 'scripts/fetch-demodb-fixtures.mjs') }}

      - name: nx query mobile WebKit e2e
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            pnpm nx run datatug-app:e2e-query-mobile --skip-nx-cache
          else
            pnpm nx affected --target=e2e-query-mobile --parallel=1 --base=${{ env.NX_BASE }}
          fi

      - name: Save DemoDB fixtures
        if: ${{ always() && needs.preflight.outputs.mode == 'full' && steps.demodb-fixtures.outputs.cache-hit != 'true' && hashFiles('tmp/demodb-fixtures/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: tmp/demodb-fixtures
          key: ${{ steps.demodb-fixtures.outputs.cache-primary-key }}

      - name: Upload query mobile WebKit Playwright report and traces
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-mobile-webkit-e2e-results
          path: |
            coverage/apps/datatug-query-mobile/report
            coverage/apps/datatug-query-mobile/results
          if-no-files-found: ignore

  e2e-demo-sqlite:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Checkout validated edited-copy demo revision
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: f40286a57ea3a04b93875335234665ece2595ed0
          path: datatug-demo-project

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      # DemoDB fixtures (see apps/datatug-app/e2e/helpers/demodb-guard.ts): the browser tests are served the pinned DemoDB
      # files from a local directory instead of the live demodb.dev hosts (the 2026-10-16 incident: ~25,500 requests for
      # one file rate limited the whole zone). Cached by the catalog's SHA-256 pins; Playwright's globalSetup
      # (scripts/fetch-demodb-fixtures.mjs) downloads each missing file once from GitHub, with no retry, and never from demodb.dev.
      - name: Restore DemoDB fixtures
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: demodb-fixtures
        uses: actions/cache/restore@v5
        with:
          path: tmp/demodb-fixtures
          key: demodb-fixtures-v2-${{ hashFiles('libs/datatug/main/src/lib/queries/demo-sqlite-catalog.ts', 'scripts/fetch-demodb-fixtures.mjs') }}

      - name: Install demo SQLite browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # /demo/sqlite (apps/datatug-app/e2e/demo-sqlite.spec.ts): a DemoDB SQLite file opened as an editable copy
      # in the browser. Runs the built app in Chromium, Firefox and WebKit. Every DemoDB file and page is served from the
      # local fixtures above (zero requests to demodb.dev; helpers/demodb-guard.ts fails a test that sends one and the run
      # prints per-host counts). The edited-copy Board -> Query acceptance uses the exact pinned Chinook bytes at its admitted
      # URL (WebKit's default context has no OPFS, so it asserts the in-memory behaviour). The 126.8 MB AdventureWorks
      # download is opt-in (DATATUG_E2E_ADVENTUREWORKS=1) and not run here. The same target also runs
      # demo-sqlite-datasets.spec.ts (one smoke journey per catalog dataset, plus a check that the DemoDB registry
      # at demodb.dev and the DataTug catalog agree) and demo-sqlite-journey.spec.ts (DemoDB page -> CTA -> DataTug
      # /demo/sqlite/<dataset>, with the datatug.app origin mapped to this build and the committed DemoDB pages). The live-site
      # check is the manual workflow demodb-live-smoke.yml.
      - name: nx e2e-demo-sqlite, including edited-copy Board to Query
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: |
          test "$(git -C "$DATATUG_E2E_GITHUB_FAKE" rev-parse HEAD)" = 'f40286a57ea3a04b93875335234665ece2595ed0'
          if [ "${{ github.event_name }}" = schedule ]; then
            pnpm nx run datatug-app:e2e-demo-sqlite --skip-nx-cache
          else
            pnpm nx affected --target=e2e-demo-sqlite --parallel=1 --base=${{ env.NX_BASE }}
          fi

      - name: Save DemoDB fixtures
        if: ${{ always() && needs.preflight.outputs.mode == 'full' && steps.demodb-fixtures.outputs.cache-hit != 'true' && hashFiles('tmp/demodb-fixtures/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: tmp/demodb-fixtures
          key: ${{ steps.demodb-fixtures.outputs.cache-primary-key }}

      - name: Upload demo SQLite e2e report
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-sqlite-e2e-playwright-report
          path: |
            coverage/apps/datatug-app-demo-sqlite-e2e/report
            coverage/apps/datatug-app-demo-sqlite-e2e/results
          if-no-files-found: ignore

  # /demo/ovdb/<dataset>-postgresql (apps/datatug-app/e2e/demo-postgresql.spec.ts): the hosted, read-only PostgreSQL
  # DemoDB editions opened THROUGH the public OpenVaultDB server (cloud.openvaultdb.com), never Neon directly. Runs the
  # built app in Chromium and Firefox against the REAL live API (so it needs the network and tolerates cold starts:
  # long waits and the app's own 503 back-off; Playwright never retries a test, every test has a request budget, and
  # HTTP 429 stops the run). Chromium smoke-tests every edition; Firefox only Chinook. Nightly only: it needs a live
  # third-party host, so it never runs on pull requests, merge groups or pushes. Its own job, so an outage of the live
  # API fails this lane and nothing else; it is part of the nightly "e2e" aggregate below.
  e2e-demo-postgresql:
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: Install demo PostgreSQL browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: nx e2e-demo-postgresql
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
        run: pnpm nx run datatug-app:e2e-demo-postgresql --skip-nx-cache

      - name: Upload demo PostgreSQL e2e report
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-postgresql-e2e-playwright-report
          path: |
            coverage/apps/datatug-app-demo-postgresql-e2e/report
            coverage/apps/datatug-app-demo-postgresql-e2e/results
          if-no-files-found: ignore

  e2e-demo-handoff:
    if: always()
    runs-on: ubuntu-latest
    needs: [preflight, build]
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Derive appropriate SHAs for base and head for nx affected commands
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: nrwl/nx-set-shas@v5

      - name: Install demo handoff browser
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium

      # G-0 hand-off suite (apps/datatug-app/e2e/demo-handoff.spec.ts): the holding page for /demo and the
      # project chat, and proof that the visitor's question reaches no analytics or error report. It needs the
      # PRODUCTION build (real Sentry DSN and analytics: playwright.demo-handoff.config.ts serves
      # `serve:production`), so it is its own target rather than part of "e2e" above, which serves the
      # development build.
      - name: nx e2e-demo-handoff
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            pnpm nx run datatug-app:e2e-demo-handoff --skip-nx-cache
          else
            pnpm nx affected --target=e2e-demo-handoff --parallel=1 --base=${{ env.NX_BASE }}
          fi

      - name: Upload demo hand-off e2e report
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-handoff-e2e-playwright-report
          path: coverage/apps/datatug-app-demo-handoff-e2e/report
          if-no-files-found: ignore

  # `e2e` is the strict nightly aggregate of browser and real-agent lanes,
  # including the live-API PostgreSQL lane. Production uses `deploy-gate` below.
  # Keep the existing check name for nightly reports. `always()` makes it run even
  # when build fails and GitHub skips its dependent lanes; every lane must
  # actually succeed, so a skipped or cancelled lane cannot pass this check.
  e2e:
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [build, e2e-checkout, e2e-app, e2e-query-mobile, e2e-demo-sqlite, e2e-demo-postgresql, e2e-demo-handoff, journey, agent-links]
    steps:
      - name: Require every E2E lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKOUT_RESULT: ${{ needs.e2e-checkout.result }}
          APP_RESULT: ${{ needs.e2e-app.result }}
          QUERY_MOBILE_RESULT: ${{ needs.e2e-query-mobile.result }}
          SQLITE_RESULT: ${{ needs.e2e-demo-sqlite.result }}
          POSTGRESQL_RESULT: ${{ needs.e2e-demo-postgresql.result }}
          HANDOFF_RESULT: ${{ needs.e2e-demo-handoff.result }}
          JOURNEY_RESULT: ${{ needs.journey.result }}
          LINKS_RESULT: ${{ needs.agent-links.result }}
          LINKS_REF: ${{ vars.DATATUG_LINKS_CLI_REF }}
        run: |
          for result in "$BUILD_RESULT" "$CHECKOUT_RESULT" "$APP_RESULT" "$QUERY_MOBILE_RESULT" "$SQLITE_RESULT" "$POSTGRESQL_RESULT" "$HANDOFF_RESULT" "$JOURNEY_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "Required E2E dependency ended with: $result" >&2
              exit 1
            fi
          done
          if [[ ( -n "$LINKS_REF" && "$LINKS_RESULT" != success ) || ( -z "$LINKS_REF" && "$LINKS_RESULT" != skipped ) ]]; then
            echo "Card-link E2E ended with: $LINKS_RESULT (ref configured: $([[ -n "$LINKS_REF" ]] && echo yes || echo no))" >&2
            exit 1
          fi

  # Production deploy gate (deploy.yml requires this job's conclusion to be
  # `success` for the commit it deploys; also safe to make a required check).
  # Gates on every offline lane that proves the shipped app: the browser suites
  # (none of which sends a request to demodb.dev or any other live third party),
  # the real-agent journey and, once DATATUG_LINKS_CLI_REF is set, the card
  # links. Deliberately NOT on e2e-demo-postgresql: it drives the real
  # cloud.openvaultdb.com API, so it runs nightly only. `always()` + exact
  # `success` per lane: a failed, skipped or cancelled lane (including lanes
  # skipped because `build` failed) fails the gate; agent-links alone may be
  # `skipped`. Add new lanes here. Not run on the nightly schedule.
  deploy-gate:
    name: deploy-gate
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - e2e-checkout
      - e2e-app
      - e2e-query-mobile
      - e2e-demo-sqlite
      - e2e-demo-handoff
      - journey
      - agent-links
    steps:
      - name: Require every gating lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=0
          for lane in build test e2e-checkout e2e-app e2e-query-mobile e2e-demo-sqlite e2e-demo-handoff journey agent-links; do
            result="$(jq -r --arg l "$lane" '.[$l].result // "missing"' <<<"$NEEDS_JSON")"
            if [[ "$result" == success || ( "$lane" == agent-links && "$result" == skipped ) ]]; then
              echo "ok      $lane: $result"
            else
              echo "::error title=deploy-gate::$lane ended with: $result"
              bad=1
            fi
          done
          exit "$bad"

  # Walks user journeys J1-J4 (apps/datatug-app/e2e/journey/**, project
  # "journey" in playwright.config.ts) against a REAL `datatug serve` agent
  # built from a pinned datatug-cli release — no HTTP route interception.
  # See apps/datatug-app/e2e/README.md for what this suite needs and why it
  # is a separate job from "e2e" above (that job stubs the agent and only
  # runs affected specs; this one always runs and proves the actual web <->
  # agent contract). Always runs (not gated by `nx affected`) because it is
  # the one suite that can catch a datatug-cli-side regression even when no
  # file in this repo changed. Run it nightly with the other E2E suites.
  journey:
    if: always()
    # `env` is not an available context for `jobs.<job_id>.name`, so the
    # pinned tag can't be interpolated here — it's visible in the "Checkout
    # datatug-cli" step name below instead. Keep this literal name and the
    # env var below in sync when bumping DATATUG_CLI_REF.
    name: journey e2e (real datatug-cli agent)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    needs: [preflight, build]
    env:
      GH_TOKEN: ${{ github.token }}
      # Pinned datatug release tag (not `main`) so this job is
      # reproducible. Bump by checking the newest `vX.Y.Z` tag:
      #   gh release list --repo datatug/datatug
      # See apps/datatug-app/e2e/README.md "Bumping the pinned CLI tag".
      DATATUG_CLI_REF: v0.78.0
      # Session continuity requires the authenticated local Session runtime.
      DATATUG_SESSION_CLI_REF: v0.93.0
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout datatug-apps
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6

      # Download prebuilt datatug binary from public datatug/datatug releases.
      - name: Download and verify pinned datatug CLI (${{ env.DATATUG_CLI_REF }})
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p "$RUNNER_TEMP/datatug-bin" "$RUNNER_TEMP/datatug-dl"
          gh release download "${{ env.DATATUG_CLI_REF }}" \
            --repo datatug/datatug \
            --pattern "datatug_*_linux_amd64.tar.gz" \
            --pattern "datatug_*_checksums.txt" \
            --dir "$RUNNER_TEMP/datatug-dl"
          cd "$RUNNER_TEMP/datatug-dl"
          grep "linux_amd64.tar.gz" datatug_*_checksums.txt | sha256sum --check
          tar -xzf datatug_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/datatug-bin" datatug
          chmod +x "$RUNNER_TEMP/datatug-bin/datatug"
          echo "DATATUG_BIN=$RUNNER_TEMP/datatug-bin/datatug" >> "$GITHUB_ENV"

      # Public repo (datatug/datatug-demo-project), main branch — the demo
      # project the journey suite drives the agent against. Same nested-path
      # reasoning as datatug-apps checkout above.
      - name: Checkout datatug-demo-project (main)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: main
          path: datatug-demo-project

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      # The journey fixture (e2e/journey/fixtures/agent-server.ts) spawns
      # `datatug serve` itself; it does not fetch this dependency. `datatug
      # demo` normally does (apps/datatugapp/commands/cmd_demo.go
      # downloadSQLiteSource), but that command then blocks forever serving
      # the demo project, so it can't be used as a CI step — this downloads
      # a pinned copy of the same fixture file to the same path
      # (`~/datatug/dbs/chinook-local.sqlite`) that
      # environments/local/catalogs/chinook-local/chinook-local.db.json in
      # datatug-demo-project declares, without the `serve` call. Verify the
      # content: github.com/.../blob?raw=true can return HTML with HTTP 200.
      - name: Fetch and verify pinned Chinook SQLite fixture
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p "$HOME/datatug/dbs"
          curl -fsSL -o "$HOME/datatug/dbs/chinook-local.sqlite" \
            "https://raw.githubusercontent.com/datatug/chinook-database/6334395117e2478a2712e083be614721341c26c9/ChinookDatabase/DataSources/Chinook_Sqlite.sqlite"
          echo "f82efedb6c5c40734609e168bc5be5616a2eca6b90ed0048451a8674625e03a3  $HOME/datatug/dbs/chinook-local.sqlite" | sha256sum --check

      - name: Install Playwright browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium

      # Fail fast on a build break before spending the journey suite's
      # runtime; playwright.config.ts's own webServer starts the dev server
      # for the actual test run (`nx run datatug-app:serve:development`), so
      # this is a production-config build check, not a second server.
      - name: Build datatug-app
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          AG_GRID_LICENSE_KEY: ${{ vars.AG_GRID_LICENSE_KEY }}
        run: python3 tools/recordsetcompare/build_app.py

      - name: Run journey e2e (J1-J4, real datatug-cli agent)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_DEMO_DIR: ${{ github.workspace }}/datatug-demo-project/demo-project-1
        run: pnpm exec playwright test -c apps/datatug-app/playwright.config.ts --project=journey --workers=1

      - name: Download and verify Session continuity CLI
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p "$RUNNER_TEMP/datatug-session-bin" "$RUNNER_TEMP/datatug-session-dl"
          gh release download "${{ env.DATATUG_SESSION_CLI_REF }}" \
            --repo datatug/datatug \
            --pattern "datatug_*_linux_amd64.tar.gz" \
            --pattern "datatug_*_checksums.txt" \
            --dir "$RUNNER_TEMP/datatug-session-dl"
          cd "$RUNNER_TEMP/datatug-session-dl"
          grep "linux_amd64.tar.gz" datatug_*_checksums.txt | sha256sum --check
          tar -xzf datatug_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/datatug-session-bin" datatug
          chmod +x "$RUNNER_TEMP/datatug-session-bin/datatug"
          echo "DATATUG_SESSION_BIN=$RUNNER_TEMP/datatug-session-bin/datatug" >> "$GITHUB_ENV"

      - name: Run real CLI Session continuity
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_BIN: ${{ env.DATATUG_SESSION_BIN }}
        run: pnpm exec playwright test -c apps/datatug-app/playwright.session-continuity.config.ts

      - name: Upload Playwright report
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: journey-e2e-playwright-report
          path: coverage/apps/datatug-app-e2e/report
          if-no-files-found: ignore
          retention-days: 7

      # The agent's own stdout+stderr (e2e/journey/README.md) — the only way
      # to see why `datatug serve` refused to start or what it logged for a
      # request that failed.
      - name: Upload agent logs
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: journey-e2e-agent-logs
          path: coverage/apps/datatug-app-e2e/journey/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Card links (Feature claude-mod-web-links): the table, records and record pages a DataTug Claude Code mod card
  # links to, against a REAL `datatug daemon start` with links from `datatug daemon url`, served at
  # datatug.localhost (the only development origin the agent admits). See apps/datatug-app/e2e/README.md
  # "Card links". Runs once the repository variable DATATUG_LINKS_CLI_REF names a datatug release that has the
  # read-only records/schema and records/lookup routes (datatug-cli #399).
  agent-links:
    name: card-link e2e (real datatug daemon)
    if: ${{ always() && vars.DATATUG_LINKS_CLI_REF != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    needs: [preflight, build]
    env:
      GH_TOKEN: ${{ github.token }}
      DATATUG_CLI_REF: ${{ vars.DATATUG_LINKS_CLI_REF }}
    steps:
      - name: Require successful metadata preflight
        run: test '${{ needs.preflight.result }}' = success && test '${{ needs.build.result }}' = success
      - name: Verified metadata-only change; application checks not applicable
        if: needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'metadata-only'
        run: echo 'Verified SpecScore status-only change; application checks not applicable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout datatug-apps
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6

      - name: Download and verify datatug CLI (${{ env.DATATUG_CLI_REF }})
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p "$RUNNER_TEMP/datatug-bin" "$RUNNER_TEMP/datatug-dl"
          gh release download "${{ env.DATATUG_CLI_REF }}" \
            --repo datatug/datatug \
            --pattern "datatug_*_linux_amd64.tar.gz" \
            --pattern "datatug_*_checksums.txt" \
            --dir "$RUNNER_TEMP/datatug-dl"
          cd "$RUNNER_TEMP/datatug-dl"
          grep "linux_amd64.tar.gz" datatug_*_checksums.txt | sha256sum --check
          tar -xzf datatug_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/datatug-bin" datatug
          chmod +x "$RUNNER_TEMP/datatug-bin/datatug"
          echo "DATATUG_BIN=$RUNNER_TEMP/datatug-bin/datatug" >> "$GITHUB_ENV"

      - name: Checkout datatug-demo-project (main)
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: main
          path: datatug-demo-project

      - name: Authenticate private Core artifact verification
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        id: core-artifact-token
        uses: ./.github/actions/private-core-artifact
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}

      - uses: ./.github/actions/pnpm
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}

      - name: Fetch and verify pinned Chinook SQLite fixture
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p "$HOME/datatug/dbs"
          curl -fsSL -o "$HOME/datatug/dbs/chinook-local.sqlite" \
            "https://raw.githubusercontent.com/datatug/chinook-database/6334395117e2478a2712e083be614721341c26c9/ChinookDatabase/DataSources/Chinook_Sqlite.sqlite"
          echo "f82efedb6c5c40734609e168bc5be5616a2eca6b90ed0048451a8674625e03a3  $HOME/datatug/dbs/chinook-local.sqlite" | sha256sum --check

      - name: Install Playwright browsers
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run card-link e2e
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ steps.core-artifact-token.outputs.token }}
          DATATUG_DEMO_DIR: ${{ github.workspace }}/datatug-demo-project/demo-project-1
        run: pnpm nx run datatug-app:e2e-agent-links --skip-nx-cache

      - name: Upload Playwright report
        if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.mode == 'full' && (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-links-e2e-playwright-report
          path: coverage/apps/datatug-app-agent-links-e2e
          if-no-files-found: ignore
          retention-days: 7
