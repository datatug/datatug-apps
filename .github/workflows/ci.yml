name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.git-hooks/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.git-hooks/**'
  merge_group:

permissions:
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: nx lint affected
        run: pnpm nx affected --target=lint --base=${{ env.NX_BASE }} --parallel=8

      # Whole-repo static check (not nx-affected-scoped — it's a single
      # cheap AST walk, not a per-project target): fails the build if any
      # *.component.ts writes a plain field from inside subscribe()/then()/
      # catch()/finally()/setTimeout()/setInterval() and isn't listed in
      # tools/zoneless-allowlist.txt. See tools/check-zoneless-fields.mjs
      # for the rule and AGENTS.md's "Change detection & state" section for
      # the fix recipe.
      - name: check:zoneless (no new plain-field writes from async callbacks)
        run: pnpm run check:zoneless

      # Fixture-based unit tests for check-zoneless-fields.mjs's own AST
      # logic (tools/__tests__/) — cheap enough to run unconditionally
      # alongside the check itself, same as the check isn't nx-affected-scoped.
      - name: test:check-zoneless-fields (detector's own unit tests)
        run: pnpm run test:check-zoneless-fields

      - name: test:checkout-flow (quote, payment and return contract)
        run: pnpm run test:checkout-flow

      - name: test:wrangler-routes (preserve production app hostnames)
        run: pnpm run test:wrangler-routes

      - name: test:RecordsetCompare artifact verifier guards
        run: python3 -m unittest discover -s tools/recordsetcompare -p 'test_*.py' -v

      - name: nx build affected
        run: pnpm nx affected --target=build --base=${{ env.NX_BASE }} --parallel=8

      - name: Find affected datatug-app target
        id: affected-app
        run: |
          projects="$(pnpm exec nx show projects --affected --json)"
          app_affected="$(PROJECTS_JSON="$projects" node -e 'process.stdout.write(JSON.parse(process.env.PROJECTS_JSON).includes("datatug-app") ? "true" : "false")')"
          echo "datatug_app=$app_affected" >> "$GITHUB_OUTPUT"

      - name: Verify emitted RecordsetCompare assets
        if: steps.affected-app.outputs.datatug_app == 'true'
        run: python3 tools/recordsetcompare/consume.py verify-dist

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: nx typecheck-spec main
        run: pnpm nx run datatug-main:typecheck-spec

      - name: Cache Vite dependency pre-bundle
        uses: actions/cache@v5
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: nx test affected
        run: pnpm nx affected --target=test --parallel=4 --base=${{ env.NX_BASE }}

  # Independent browser suites use separate runners so their app servers,
  # Playwright artifacts and Nx state cannot contend. Keep app and query-mobile
  # together because both use the development app on port 4200.
  e2e-checkout:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: Install checkout browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Set up Java for checkout Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: nx checkout journey e2e affected
        run: pnpm nx affected --target=e2e-checkout --parallel=1 --base=${{ env.NX_BASE }}

      - name: Upload checkout journey traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checkout-journey-e2e-results
          path: coverage/apps/datatug-checkout/results
          if-no-files-found: ignore

  e2e-app:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      # The browser suite counts the real reader's GitHub API/raw requests, but
      # anonymous API access from a shared CI runner can exhaust its quota.
      # Serve the current public demo commit through the existing GitHub HTTP
      # fake, and check the live API/tree/raw contracts at that same commit.
      - name: Checkout canonical demo project
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: main
          path: datatug-demo-project

      - name: Verify live canonical GitHub source
        run: |
          set -euo pipefail
          sha="$(git -C datatug-demo-project rev-parse HEAD)"
          test "$(gh api repos/datatug/datatug-demo-project/commits/HEAD --jq .sha)" = "$sha"
          tree="$(gh api "repos/datatug/datatug-demo-project/git/trees/$sha?recursive=1" --jq '[.truncated, ([.tree[].path] | index("demo-project-1/entities/Album/Album.entity.json") != null), ([.tree[].path] | index("demo-project-1/queries/customers/customer-invoices.query.json") != null)] | @json')"
          test "$tree" = '[false,true,true]'
          curl -fsSL "https://raw.githubusercontent.com/datatug/datatug-demo-project/$sha/demo-project-1/entities/Album/Album.entity.json" -o "$RUNNER_TEMP/demo-album.json"
          cmp datatug-demo-project/demo-project-1/entities/Album/Album.entity.json "$RUNNER_TEMP/demo-album.json"

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: Find affected datatug-app project
        id: affected-app
        run: |
          projects="$(pnpm exec nx show projects --affected --json)"
          app_affected="$(PROJECTS_JSON="$projects" node -e 'process.stdout.write(JSON.parse(process.env.PROJECTS_JSON).includes("datatug-app") ? "true" : "false")')"
          echo "datatug_app=$app_affected" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        run: |
          browsers=(chromium)
          if [[ "${{ steps.affected-app.outputs.datatug_app }}" == "true" ]]; then
            browsers+=(webkit firefox)
          fi
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Smoke query context count geometry on Chromium
        if: steps.affected-app.outputs.datatug_app == 'true'
        env:
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: pnpm nx run datatug-app:e2e -- --project=chromium --grep='query context counts stay inline through two digits and unavailable drafts'

      - name: nx e2e affected
        env:
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: pnpm nx affected --target=e2e --parallel=1 --base=${{ env.NX_BASE }}

      - name: Upload app Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datatug-app-e2e-results
          path: |
            coverage/apps/datatug-app-e2e/report
            coverage/apps/datatug-app-e2e/results
          if-no-files-found: ignore

      - name: nx query mobile WebKit e2e affected
        env:
          DATATUG_E2E_GITHUB_FAKE: ${{ github.workspace }}/datatug-demo-project
        run: pnpm nx affected --target=e2e-query-mobile --parallel=1 --base=${{ env.NX_BASE }}

      - name: Upload query mobile WebKit Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: query-mobile-webkit-e2e-results
          path: |
            coverage/apps/datatug-query-mobile/report
            coverage/apps/datatug-query-mobile/results
          if-no-files-found: ignore

  e2e-demo-sqlite:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: Install demo SQLite browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # /demo/sqlite (apps/datatug-app/e2e/demo-sqlite.spec.ts): a DemoDB SQLite file opened as an editable copy
      # in the browser. Runs the built app in Chromium, Firefox and WebKit against the real demodb.dev files
      # (WebKit's default context has no OPFS, so it asserts the in-memory behaviour). The 126.8 MB AdventureWorks
      # download is opt-in (DATATUG_E2E_ADVENTUREWORKS=1) and not run here. The same target also runs
      # demo-sqlite-datasets.spec.ts (one smoke journey per catalog dataset, plus a check that the DemoDB registry
      # at demodb.dev and the DataTug catalog agree) and demo-sqlite-journey.spec.ts (DemoDB page -> CTA -> DataTug
      # /demo/sqlite/<dataset>, with the datatug.app origin mapped to this build and the live demodb.dev pages).
      - name: nx e2e-demo-sqlite affected
        run: pnpm nx affected --target=e2e-demo-sqlite --parallel=1 --base=${{ env.NX_BASE }}

      - name: Upload demo SQLite e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-sqlite-e2e-playwright-report
          path: |
            coverage/apps/datatug-app-demo-sqlite-e2e/report
            coverage/apps/datatug-app-demo-sqlite-e2e/results
          if-no-files-found: ignore

  e2e-demo-handoff:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pnpm

      - name: Derive appropriate SHAs for base and head for nx affected commands
        uses: nrwl/nx-set-shas@v5

      - name: Install demo handoff browser
        run: pnpm exec playwright install --with-deps chromium

      # G-0 hand-off suite (apps/datatug-app/e2e/demo-handoff.spec.ts): the holding page for /demo and the
      # project chat, and proof that the visitor's question reaches no analytics or error report. It needs the
      # PRODUCTION build (real Sentry DSN and analytics: playwright.demo-handoff.config.ts serves
      # `serve:production`), so it is its own target rather than part of "e2e" above, which serves the
      # development build.
      - name: nx e2e-demo-handoff affected
        run: pnpm nx affected --target=e2e-demo-handoff --parallel=1 --base=${{ env.NX_BASE }}

      - name: Upload demo hand-off e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-handoff-e2e-playwright-report
          path: coverage/apps/datatug-app-demo-handoff-e2e/report
          if-no-files-found: ignore

  # Keep the existing required check name. `always()` makes the gate run even
  # when build fails and GitHub skips its dependent lanes; every lane must
  # actually succeed, so a skipped or cancelled lane cannot pass this check.
  e2e:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, e2e-checkout, e2e-app, e2e-demo-sqlite, e2e-demo-handoff]
    steps:
      - name: Require every E2E lane
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKOUT_RESULT: ${{ needs.e2e-checkout.result }}
          APP_RESULT: ${{ needs.e2e-app.result }}
          SQLITE_RESULT: ${{ needs.e2e-demo-sqlite.result }}
          HANDOFF_RESULT: ${{ needs.e2e-demo-handoff.result }}
        run: |
          for result in "$BUILD_RESULT" "$CHECKOUT_RESULT" "$APP_RESULT" "$SQLITE_RESULT" "$HANDOFF_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "Required E2E dependency ended with: $result" >&2
              exit 1
            fi
          done

  # Walks user journeys J1-J4 (apps/datatug-app/e2e/journey/**, project
  # "journey" in playwright.config.ts) against a REAL `datatug serve` agent
  # built from a pinned datatug-cli release — no HTTP route interception.
  # See apps/datatug-app/e2e/README.md for what this suite needs and why it
  # is a separate job from "e2e" above (that job stubs the agent and only
  # runs affected specs; this one always runs and proves the actual web <->
  # agent contract). Always runs (not gated by `nx affected`) because it is
  # the one suite that can catch a datatug-cli-side regression even when no
  # file in this repo changed.
  journey:
    # `env` is not an available context for `jobs.<job_id>.name`, so the
    # pinned tag can't be interpolated here — it's visible in the "Checkout
    # datatug-cli" step name below instead. Keep this literal name and the
    # env var below in sync when bumping DATATUG_CLI_REF.
    name: journey e2e (real datatug-cli agent)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      # Pinned datatug release tag (not `main`) so this job is
      # reproducible. Bump by checking the newest `vX.Y.Z` tag:
      #   gh release list --repo datatug/datatug
      # See apps/datatug-app/e2e/README.md "Bumping the pinned CLI tag".
      DATATUG_CLI_REF: v0.78.0
    steps:
      - name: Checkout datatug-apps
        uses: actions/checkout@v6

      # Download prebuilt datatug binary from public datatug/datatug releases.
      - name: Download and verify pinned datatug CLI (${{ env.DATATUG_CLI_REF }})
        run: |
          mkdir -p "$RUNNER_TEMP/datatug-bin" "$RUNNER_TEMP/datatug-dl"
          gh release download "${{ env.DATATUG_CLI_REF }}" \
            --repo datatug/datatug \
            --pattern "datatug_*_linux_amd64.tar.gz" \
            --pattern "datatug_*_checksums.txt" \
            --dir "$RUNNER_TEMP/datatug-dl"
          cd "$RUNNER_TEMP/datatug-dl"
          grep "linux_amd64.tar.gz" datatug_*_checksums.txt | sha256sum --check
          tar -xzf datatug_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/datatug-bin" datatug
          chmod +x "$RUNNER_TEMP/datatug-bin/datatug"
          echo "DATATUG_BIN=$RUNNER_TEMP/datatug-bin/datatug" >> "$GITHUB_ENV"

      # Public repo (datatug/datatug-demo-project), main branch — the demo
      # project the journey suite drives the agent against. Same nested-path
      # reasoning as datatug-apps checkout above.
      - name: Checkout datatug-demo-project (main)
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: main
          path: datatug-demo-project

      - uses: ./.github/actions/pnpm

      # The journey fixture (e2e/journey/fixtures/agent-server.ts) spawns
      # `datatug serve` itself; it does not fetch this dependency. `datatug
      # demo` normally does (apps/datatugapp/commands/cmd_demo.go
      # downloadSQLiteSource), but that command then blocks forever serving
      # the demo project, so it can't be used as a CI step — this downloads
      # a pinned copy of the same fixture file to the same path
      # (`~/datatug/dbs/chinook-local.sqlite`) that
      # environments/local/catalogs/chinook-local/chinook-local.db.json in
      # datatug-demo-project declares, without the `serve` call. Verify the
      # content: github.com/.../blob?raw=true can return HTML with HTTP 200.
      - name: Fetch and verify pinned Chinook SQLite fixture
        run: |
          mkdir -p "$HOME/datatug/dbs"
          curl -fsSL -o "$HOME/datatug/dbs/chinook-local.sqlite" \
            "https://raw.githubusercontent.com/datatug/chinook-database/6334395117e2478a2712e083be614721341c26c9/ChinookDatabase/DataSources/Chinook_Sqlite.sqlite"
          echo "f82efedb6c5c40734609e168bc5be5616a2eca6b90ed0048451a8674625e03a3  $HOME/datatug/dbs/chinook-local.sqlite" | sha256sum --check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Fail fast on a build break before spending the journey suite's
      # runtime; playwright.config.ts's own webServer starts the dev server
      # for the actual test run (`nx run datatug-app:serve:development`), so
      # this is a production-config build check, not a second server.
      - name: Build datatug-app
        run: python3 tools/recordsetcompare/build_app.py

      - name: Run journey e2e (J1-J4, real datatug-cli agent)
        env:
          DATATUG_DEMO_DIR: ${{ github.workspace }}/datatug-demo-project/demo-project-1
        run: pnpm exec playwright test -c apps/datatug-app/playwright.config.ts --project=journey --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journey-e2e-playwright-report
          path: coverage/apps/datatug-app-e2e/report
          if-no-files-found: ignore
          retention-days: 7

      # The agent's own stdout+stderr (e2e/journey/README.md) — the only way
      # to see why `datatug serve` refused to start or what it logged for a
      # request that failed.
      - name: Upload agent logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journey-e2e-agent-logs
          path: coverage/apps/datatug-app-e2e/journey/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Card links (Feature claude-mod-web-links): the table, records and record pages a DataTug Claude Code mod card
  # links to, against a REAL `datatug daemon start` with links from `datatug daemon url`, served at
  # datatug.localhost (the only development origin the agent admits). See apps/datatug-app/e2e/README.md
  # "Card links". Runs once the repository variable DATATUG_LINKS_CLI_REF names a datatug release that has the
  # read-only records/schema and records/lookup routes (datatug-cli #399).
  agent-links:
    name: card-link e2e (real datatug daemon)
    if: ${{ vars.DATATUG_LINKS_CLI_REF != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: read
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      DATATUG_CLI_REF: ${{ vars.DATATUG_LINKS_CLI_REF }}
    steps:
      - name: Checkout datatug-apps
        uses: actions/checkout@v6

      - name: Download and verify datatug CLI (${{ env.DATATUG_CLI_REF }})
        run: |
          mkdir -p "$RUNNER_TEMP/datatug-bin" "$RUNNER_TEMP/datatug-dl"
          gh release download "${{ env.DATATUG_CLI_REF }}" \
            --repo datatug/datatug \
            --pattern "datatug_*_linux_amd64.tar.gz" \
            --pattern "datatug_*_checksums.txt" \
            --dir "$RUNNER_TEMP/datatug-dl"
          cd "$RUNNER_TEMP/datatug-dl"
          grep "linux_amd64.tar.gz" datatug_*_checksums.txt | sha256sum --check
          tar -xzf datatug_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/datatug-bin" datatug
          chmod +x "$RUNNER_TEMP/datatug-bin/datatug"
          echo "DATATUG_BIN=$RUNNER_TEMP/datatug-bin/datatug" >> "$GITHUB_ENV"

      - name: Checkout datatug-demo-project (main)
        uses: actions/checkout@v6
        with:
          repository: datatug/datatug-demo-project
          ref: main
          path: datatug-demo-project

      - uses: ./.github/actions/pnpm

      - name: Fetch and verify pinned Chinook SQLite fixture
        run: |
          mkdir -p "$HOME/datatug/dbs"
          curl -fsSL -o "$HOME/datatug/dbs/chinook-local.sqlite" \
            "https://raw.githubusercontent.com/datatug/chinook-database/6334395117e2478a2712e083be614721341c26c9/ChinookDatabase/DataSources/Chinook_Sqlite.sqlite"
          echo "f82efedb6c5c40734609e168bc5be5616a2eca6b90ed0048451a8674625e03a3  $HOME/datatug/dbs/chinook-local.sqlite" | sha256sum --check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run card-link e2e
        env:
          DATATUG_DEMO_DIR: ${{ github.workspace }}/datatug-demo-project/demo-project-1
        run: pnpm nx run datatug-app:e2e-agent-links

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-links-e2e-playwright-report
          path: coverage/apps/datatug-app-agent-links-e2e
          if-no-files-found: ignore
          retention-days: 7
