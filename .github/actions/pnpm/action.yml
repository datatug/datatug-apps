name: 'PNPM install'

description: 'Installs PNPM & runs `pnpm install`'

runs:
  using: 'composite'
  steps:
    - run: git rev-parse HEAD
      shell: sh

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      env:
        # Nested git-hosted packages run their own install scripts, and those
        # scripts may try to switch pnpm versions. Ignore the version-switch
        # failure so the existing workspace pnpm remains active instead of
        # bailing before dependency installation begins.
        PNPM_CONFIG_PM_ON_FAIL: ignore

    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        cache: 'pnpm'
        node-version: '24'

    - run: pnpm --version
      shell: sh

    - name: Install dependencies
      run: pnpm install
      shell: sh
      env:
        # GitHub-pinned dependencies (@dalgo/*, @openvaultdb/inprocess) are
        # built on install by a nested `pnpm install` inside their own
        # repositories, whose packageManager pins another pnpm version. The
        # nested pnpm then tries to switch versions and fails on the runner
        # ("Failed to switch pnpm to v11.20.0 ... CLI is missing"). Run the
        # nested installs with the pnpm already set up instead. The workspace
        # pnpm-workspace.yaml does not reach the nested install; the
        # environment does.
        PNPM_CONFIG_PM_ON_FAIL: ignore
