name: Install Playwright browsers
description: >-
  Restores the Playwright browser cache (keyed on the locked Playwright version and the browser list), then installs the
  browsers and their system libraries. Each attempt is time-boxed and retried, so a slow Ubuntu mirror fails fast and
  clearly instead of eating the job's timeout-minutes (2026-10-23: e2e-query-mobile died twice on a 13.6 MB apt download).
inputs:
  browsers:
    description: Space-separated Playwright browsers, for example "chromium" or "chromium webkit".
    required: true
  attempt-timeout-minutes:
    description: Wall-clock limit for one install attempt.
    default: '6'
  attempts:
    description: How many attempts before the step fails.
    default: '3'
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        v=$(grep -m1 -E '^  playwright@[0-9]' pnpm-lock.yaml | sed -E 's/^  playwright@([^:]+):.*/\1/')
        echo "playwright=${v:-unknown}" >> "$GITHUB_OUTPUT"
        echo "browsers-key=$(echo '${{ inputs.browsers }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-${{ steps.version.outputs.browsers-key }}

    - name: Make apt fail fast and retry
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99-ci-fast-fail >/dev/null <<'CONF'
        Acquire::Retries "3";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        CONF

    # Cache hit: browsers are on disk, so only the system libraries are fetched (install-deps, no browser download).
    # Cache miss: full download. Either way a hung attempt is killed and retried.
    - name: Install Playwright browsers and system dependencies
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        ATTEMPTS: ${{ inputs.attempts }}
        LIMIT_MIN: ${{ inputs.attempt-timeout-minutes }}
      run: |
        if [ "$CACHE_HIT" = "true" ]; then cmd="install-deps"; else cmd="install --with-deps"; fi
        start=$(date +%s)
        for i in $(seq 1 "$ATTEMPTS"); do
          echo "Attempt $i/$ATTEMPTS: playwright $cmd $BROWSERS"
          if timeout "${LIMIT_MIN}m" pnpm exec playwright $cmd $BROWSERS; then
            echo "Playwright install ok in $(( $(date +%s) - start ))s (cache-hit=$CACHE_HIT)"
            exit 0
          fi
          echo "::warning::Playwright install attempt $i timed out or failed"
          sudo pkill -f 'apt-get|dpkg' 2>/dev/null || true
        done
        echo "::error::Playwright install failed after $ATTEMPTS attempts ($(( $(date +%s) - start ))s)"
        exit 1
