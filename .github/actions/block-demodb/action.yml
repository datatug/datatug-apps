name: 'Block DemoDB hosts'
description: >
  Makes every DemoDB host (demodb.dev, www, ovdb and one sub-domain per catalog dataset) and the public OpenVaultDB API (openvaultdb.com, cloud.openvaultdb.com) unreachable from this runner by mapping
  it to 0.0.0.0 in /etc/hosts. Backstop under the Playwright guard (apps/datatug-app/e2e/helpers/demodb-guard.ts): it also covers
  Firefox, WebKit, Node and the datatug CLI, and a context or request the guard's route cannot see. The guard still serves the
  fixtures: they are answered by the route before any name lookup. Run it early in every CI job that executes tests or app code.
  Never use it in the manual live-smoke workflow.
runs:
  using: 'composite'
  steps:
    - name: Map DemoDB and OpenVaultDB hosts to 0.0.0.0 and prove it
      shell: bash
      run: |
        set -euo pipefail
        # Both families: a name that only had an IPv4 entry would still resolve to its real IPv6 address and escape the block.
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/demodb-hosts.mjs | awk '{print "0.0.0.0 " $1; print ":: " $1}' | sudo tee -a /etc/hosts > /dev/null
        count="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/demodb-hosts.mjs | wc -l)"
        echo "Blocked $count DemoDB host names in /etc/hosts"
        # Proof, without any network: EVERY address the system resolver returns for a sample of each family (the DemoDB apex, a dataset
        # sub-domain, the OVDB API on demodb.dev, both public OpenVaultDB names) must be 0.0.0.0 or ::. `getent ahosts` lists both
        # families; a name that is not in /etc/hosts would be sent to DNS and fail this check.
        for host in demodb.dev chinook.demodb.dev ovdb.demodb.dev openvaultdb.com cloud.openvaultdb.com; do
          addresses="$(getent ahosts "$host" | awk '{print $1}' | sort -u | tr '\n' ' ')"
          if [ -z "$addresses" ] || [ -n "$(getent ahosts "$host" | awk '{print $1}' | grep -v -x -e '0.0.0.0' -e '::' || true)" ]; then
            echo "::error title=DemoDB block::$host resolves to '${addresses:-nothing}', not only 0.0.0.0 / ::, after the hosts block"
            exit 1
          fi
        done
        echo "DemoDB and OpenVaultDB hosts resolve only to 0.0.0.0 / :: (checked demodb.dev, chinook.demodb.dev, ovdb.demodb.dev, openvaultdb.com, cloud.openvaultdb.com)"
