<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Incidentius</title>
  <desc id="desc">Turn incident evidence into a defensible resolution.</desc>
